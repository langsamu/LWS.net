services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5.2
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"
      - "4318:18890"

  css:
    build:
      dockerfile: css-lws.Dockerfile
    environment:
      CSS_CONFIG: /config/lws-open.json
      CSS_BASE_URL: http://css:3000/
      CSS_PORT: "3000"
      CSS_ROOT_FILE_PATH: /data
      CSS_LOGGING_LEVEL: warn
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18890
      OTEL_SERVICE_NAME: server-css
      OTEL_METRICS_EXPORTER: none
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/3000"]
      interval: 5s
      retries: 30
      start_period: 60s
    depends_on:
      aspire-dashboard:
        condition: service_started

  suite:
    build:
      context: ../..
      dockerfile: Suite/Docker/suite.Dockerfile
    environment:
      Suite__BaseUri: http://css:3000/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: test-langsamu
    depends_on:
      aspire-dashboard:
        condition: service_started
      css:
        condition: service_healthy
