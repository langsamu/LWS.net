services:
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:13133/status"]
      interval: 5s
      retries: 30

  ebremer-server:
    build:
      dockerfile: ebremer-server.Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dlws.base-uri=http://ebremer-server:8080
        -Dlws.dev.open=true
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: ebremer lws-server (Docker)
      OTEL_LOGS_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      retries: 30
    depends_on:
      jaeger:
        condition: service_healthy

  suite:
    build:
      context: ../..
      dockerfile: Suite/Docker/suite.Dockerfile
    environment:
      Suite__BaseUri: http://ebremer-server:8080/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: LWS Test Suite (Console) (Docker)
    depends_on:
      jaeger:
        condition: service_healthy
      ebremer-server:
        condition: service_healthy
