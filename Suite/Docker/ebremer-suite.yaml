services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5.2
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"
      - "4318:18890"

  ebremer-server:
    build:
      dockerfile: ebremer-server.Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dlws.base-uri=http://ebremer-server:8080
        -Dlws.dev.open=true
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18890
      OTEL_SERVICE_NAME: server-ebremer
      OTEL_METRICS_EXPORTER: none
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      retries: 30
    depends_on:
      aspire-dashboard:
        condition: service_started

  suite:
    build:
      context: ../..
      dockerfile: Suite/Docker/suite.Dockerfile
    environment:
      Suite__BaseUri: http://ebremer-server:8080/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: test-langsamu
    depends_on:
      aspire-dashboard:
        condition: service_started
      ebremer-server:
        condition: service_healthy
