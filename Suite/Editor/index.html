<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>LWS manifest editor</title>
        <script type="importmap">
            {
                "imports": {
                    "blockly": "https://cdn.jsdelivr.net/npm/blockly@13.4.0/+esm",
                    "n3": "https://esm.sh/n3@2.13.12",
                    "@rdfjs/dataset": "https://esm.sh/@rdfjs/dataset@2.0.3",
                    "@rdfjs/wrapper": "https://esm.sh/@rdfjs/wrapper@0.34.0",
                    "@rdfjs/serializer-turtle": "https://esm.sh/@rdfjs/serializer-turtle@1.1.6",
                    "@rdfjs/prefix-map/PrefixMap.js": "https://esm.sh/@rdfjs/prefix-map@0.1.2/PrefixMap.js",
                    "@codemirror/state": "https://esm.sh/*@codemirror/state@6.7.6",
                    "@codemirror/view": "https://esm.sh/*@codemirror/view@6.43.15",
                    "@codemirror/language": "https://esm.sh/*@codemirror/language@6.13.1",
                    "@codemirror/streamparser": "https://esm.sh/*@codemirror/streamparser@6.0.0",
                    "@codemirror/legacy-modes/mode/turtle": "https://esm.sh/*@codemirror/legacy-modes@6.5.5/mode/turtle",
                    "@lezer/common": "https://esm.sh/*@lezer/common@1.5.5",
                    "@lezer/highlight": "https://esm.sh/*@lezer/highlight@1.2.5",
                    "@lezer/lr": "https://esm.sh/*@lezer/lr@1.4.12",
                    "@marijn/find-cluster-break": "https://esm.sh/*@marijn/find-cluster-break@1.0.4",
                    "crelt": "https://esm.sh/*crelt@1.0.7",
                    "style-mod": "https://esm.sh/*style-mod@4.1.4",
                    "w3c-keyname": "https://esm.sh/*w3c-keyname@2.2.8"
                }
            }
        </script>
        <style>
            html, body {
                height: 100%;
                margin: 0;
                font-family: system-ui, sans-serif;
            }

            body {
                display: flex;
                flex-direction: column;
            }

            header {
                padding: .5rem 1rem;
                border-bottom: 1px solid #ccc;
                display: flex;
                gap: 1rem;
                align-items: center;
            }

            main {
                flex: 1;
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                min-height: 0;
            }

            manifest-editor {
                position: relative;
                display: block;
                min-height: 0;
            }

            manifest-editor > .host {
                position: absolute;
                inset: 0;
            }

            ttl-pane {
                display: flex;
                flex-direction: column;
                border-left: 1px solid #ccc;
                min-height: 0;
            }

            ttl-pane pre {
                flex: 1;
                margin: 0;
                padding: 1rem;
                overflow: auto;
            }
        </style>
    </head>
    <body>
        <header>
            <strong>LWS manifest editor</strong>
            <a id="download" download="manifest.ttl">Download Turtle</a>
        </header>
        <main>
            <manifest-editor></manifest-editor>
            <ttl-pane></ttl-pane>
        </main>
        <script type="module" src="dist/app.js"></script>
    </body>
</html>
