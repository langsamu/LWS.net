name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Suite/Editor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Suite/Editor/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: |
          mkdir -p ../../_site/Editor ../../_site/Model/Resources
          cp -r index.html shapes.ttl dist ../../_site/Editor/
          cp -r ../Model/Resources/. ../../_site/Model/Resources/
      - uses: actions/upload-pages-artifact@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
